# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: petry-projects/.github/standards/workflows/ci.yml
# Standard:        petry-projects/.github/standards/ci-standards.md#1-ci-pipeline-ciyml
#
# ADOPTING THIS WORKFLOW:
#   1. This ships verbatim into repos created from petry-projects/repo-template.
#   2. It is a CUSTOMIZE-PER-STACK stub: it passes out of the box so a fresh repo
#      is green on day 0. Replace the placeholder step with your stack's
#      lint / format / typecheck / unit-test / coverage steps (see the standard).
#   3. The job name `build-and-test` is the required CI status check. Keep it — or,
#      if you split into per-language jobs (e.g. TypeScript, Go, Python), update the
#      repo's branch-protection required checks to match the new job names.
#   4. Two more jobs ship by default and are org required checks — `Secret scan
#      (gitleaks)` (per push-protection.md; needs a .gitleaks.toml at root, seeded
#      by repo-template tooling) and `coverage` (green until your stack emits coverage).
#      Keep their job names stable so the required checks stay satisfied.
#
# CONVENTIONS (enforced by the standard):
#   • permissions: {} at top, least-privilege per job (CI needs contents: read)
#   • triggers: push + pull_request to main
#   • concurrency keyed by ref+sha so a new push cancels the stale run
#   • SHA-pin every third-party action (never a tag/branch)
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checkout resilience (issue #126): a momentary DNS/TLS/GitHub blip on the
      # repo fetch is the one remaining unguarded, network-bound failure in this
      # job (issue #124 hardened the in-script fetches; #83 hardened sonarcloud.yml's
      # checkout). Same idiom as sonarcloud.yml: a continue-on-error initial attempt,
      # a short backoff, then a single retry gated on the initial checkout failing.
      # The backoff is only seconds (git/GitHub transients are momentary) and is paid
      # only on failure, so the happy path never waits.
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        continue-on-error: true
      - name: Checkout backoff before retry
        if: steps.checkout.outcome == 'failure'
        run: sleep 15
      - name: Checkout repository (retry)
        if: steps.checkout.outcome == 'failure'
        # Not continue-on-error: if even the retry cannot fetch the repo, fail the
        # job fast rather than run against an empty/partial checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ── Replace the step below with your stack's checks ───────────────────────
      # Standard CI stages: lint, format check, type check, unit tests, coverage
      # (plus integration / e2e / build where applicable). For example, a Node repo:
      #   - uses: actions/setup-node@<sha> # vX   (with node-version + cache)
      #   - run: npm ci
      #   - run: npm run lint && npm run typecheck && npm test
      # See BOOTSTRAP.md and the CI standard. Until you add real steps, the
      # placeholder below keeps the required `build-and-test` check green.
      #
      # DemandRadar unit tests (pytest with coverage).
      - name: DemandRadar unit tests
        run: |
          cd pocs/demand-radar
          # Pinned + wheels-only: lock the resolved version (S8544) and skip source
          # setup scripts (S8541) for a reproducible, tamper-resistant install.
          python3 -m pip install -q --only-binary :all: pytest==9.1.1
          python3 -m pytest tests/ -q --tb=short
          echo "✓ DemandRadar tests passed"

  # Canonical secret-scan job — copied verbatim from push-protection.md#required-ci-job.
  # Produces the `Secret scan (gitleaks)` required check. Uses the gitleaks CLI (not
  # gitleaks/gitleaks-action, whose v2+ needs a paid org license); fully pinned +
  # checksum-verified; no SARIF upload, so no `security-events: write` permission.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checkout resilience (issue #126): same idiom as build-and-test/sonarcloud.yml,
      # with the full-history fetch (fetch-depth: 0) preserved on both attempts so a
      # transient blip on the heavier fetch no longer reds the secret scan.
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
        continue-on-error: true
      - name: Checkout backoff before retry
        if: steps.checkout.outcome == 'failure'
        run: sleep 15
      - name: Checkout repository (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Named GITLEAKS_CHECKSUM (not GITLEAKS_SHA256) — SonarCloud flags env var names
          # matching *SHA256* containing hex strings as Security Hotspots (false positive).
          GITLEAKS_CHECKSUM: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          # Single retry after a short backoff for transient network blips (issue
          # #124; org standard mandates exactly one retry — see sonarcloud.yml). The
          # backoff is paid only on failure, so the happy path never waits. The
          # checksum verification below still guards integrity if a retry lands a
          # different byte stream.
          retry() {
            "$@" && return 0
            echo "::warning::'$*' failed (momentary network blip) — retrying once in 15s"
            sleep 15
            "$@"
          }
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          retry curl --proto '=https' --proto-redir '=https' --tlsv1.2 -sSfL "${url}" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_CHECKSUM}  /tmp/gitleaks.tar.gz" | sha256sum -c
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin

      - name: Run gitleaks
        # Requires a .gitleaks.toml at repo root (seeded by seed-repo-template.sh).
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  # Stack-aware coverage — produces the `coverage` required check. Default stack is
  # shell/bats via kcov. GREEN-UNTIL-TESTS: when a stack emits no coverage yet, the
  # job succeeds without producing a report, so seeding it fleet-wide never bricks a
  # repo that has no test suite. It begins enforcing once tests exist. Add a per-stack
  # block below (keep the job id and `name:` as `coverage` so the required check is stable).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checkout resilience (issue #126): same idiom as build-and-test/sonarcloud.yml.
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        continue-on-error: true
      - name: Checkout backoff before retry
        if: steps.checkout.outcome == 'failure'
        run: sleep 15
      - name: Checkout repository (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Coverage (Python pytest + shell/bats via kcov)
        run: |
          # Python coverage (DemandRadar)
          if [ -d "pocs/demand-radar/tests" ]; then
            cd pocs/demand-radar
            # Pinned + wheels-only: lock the resolved version (S8544) and skip source
            # setup scripts (S8541) for a reproducible, tamper-resistant install.
            pip3 install -q --only-binary :all: pytest-cov==7.1.0
            python3 -m pytest tests/ --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing
            cd ../..
          fi

          # Shell/bats coverage (legacy)
          shopt -s globstar nullglob
          bats_files=(tests/**/*.bats)
          if [ ${#bats_files[@]} -eq 0 ]; then
            echo "No bats tests found — shell coverage not applicable."
          else
            # Single retry after a short backoff for transient network blips (issue
            # #124; org standard mandates exactly one retry — see sonarcloud.yml). Paid
            # only on failure, so the happy path never waits. kcov below is already
            # non-fatal (it falls back to running bats without coverage), so it is
            # intentionally left unwrapped.
            retry() {
              "$@" && return 0
              echo "::warning::'$*' failed (momentary network blip) — retrying once in 15s"
              sleep 15
              "$@"
            }
            retry sudo apt-get update -qq
            retry sudo apt-get install -y -qq bats
            retry pip3 install --quiet --only-binary :all: "pyyaml==6.0.2"
            mkdir -p coverage
            if sudo apt-get install -y -qq kcov; then
              kcov --include-path=. --exclude-path=tests,coverage coverage bats "${bats_files[@]}"
              echo "Coverage report written to ./coverage"
            else
              echo "::warning::kcov unavailable on this runner — running bats tests without coverage instrumentation."
              bats "${bats_files[@]}"
            fi
          fi

      # ── Per-stack expansion — replace/augment the shell block above for your stack.
      #    Keep the job id and `name:` as `coverage` so the required check is unchanged.
      #    Node:   npx jest --coverage
      #    Go:     go test ./... -coverprofile=coverage.out && go tool cover -func=coverage.out
      #    Python: pytest --cov
      #    Rust:   cargo llvm-cov --workspace