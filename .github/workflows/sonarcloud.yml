# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: petry-projects/.github/standards/workflows/sonarcloud.yml
# Standard:        petry-projects/.github/standards/ci-standards.md#3-sonarcloud-analysis
#
# ADOPTING THIS WORKFLOW:
#   1. This ships verbatim into repos created from petry-projects/repo-template.
#   2. Set sonar.projectKey / sonar.organization in sonar-project.properties to
#      match your repo (see BOOTSTRAP.md), and add the SONAR_TOKEN repo secret.
#   3. The job name `SonarCloud` is the required status check — keep it.
#   4. The scan is guarded on SONAR_TOKEN, so the job is a green no-op until the
#      secret is set — a fresh repo is not blocked on day 0.
#
# CONVENTIONS (enforced by the standard):
#   • permissions: {} at top, least-privilege per job (contents + pull-requests: read)
#   • triggers: push + pull_request to main; checkout with fetch-depth: 0
#   • first scan is continue-on-error with a single retry (SonarCloud's analysis
#     endpoint is occasionally flaky); a backoff precedes the retry so it lands
#     after the transient blip clears instead of immediately re-hitting it — sized
#     to outlast a minute-scale outage, not just a momentary one
#   • SHA-pin every third-party action (never a tag/branch)
# ─────────────────────────────────────────────────────────────────────────────
name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Job-level backstop: bound the whole job so a hang anywhere (checkout, a
    # scan that stalls before its own step timeout, etc.) fails fast instead of
    # running to GitHub's 6-hour default. Kept above the sum of the two scan
    # step timeouts + backoff so a genuine retry is never killed prematurely.
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # Checkout resilience (issue #83): the residual 20% failure (1/5) ran fast
      # (p50 45s, p95 47s) — it never entered the 120s scan backoff, and the initial
      # scan is continue-on-error so it cannot fail the job. The remaining unguarded,
      # network-bound step is this full-history fetch (fetch-depth: 0), whose ~45s
      # runtime matches the failing run. So the checkout gets the same idiom as the
      # scan: continue-on-error initial attempt, a short backoff, then a single gated
      # retry. The backoff is only seconds (git/GitHub transients are momentary,
      # unlike SonarCloud's minute-scale endpoint blips) and is paid only on failure.
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
        continue-on-error: true
      - name: Checkout backoff before retry
        if: steps.checkout.outcome == 'failure'
        # Short wait so a momentary DNS/TLS/GitHub blip clears before the single
        # retry, without materially adding to the job's wall time.
        run: sleep 15
      - name: Checkout repository (retry)
        if: steps.checkout.outcome == 'failure'
        # Not continue-on-error: if even the retry cannot fetch the repo, fail the
        # job fast rather than run the scan against an empty/partial checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Generate Python coverage so the quality gate has data for new code.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install --require-hashes --only-binary :all: -r tools/name-availability/requirements-lock.txt
      - name: Run tests and generate coverage report
        run: |
          python -m pytest tools/name-availability/tests/ \
            --cov=tools/name-availability/scripts \
            --cov-report=xml:coverage.xml
      - name: SonarCloud Scan
        id: sonar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        # Step timeout so a hung scan (SonarCloud's endpoint occasionally stalls
        # rather than erroring) fails fast — letting continue-on-error mark it
        # failed and trigger the backoff + retry, instead of hanging for hours.
        timeout-minutes: 10
        continue-on-error: true
      - name: Backoff before retry
        if: env.SONAR_TOKEN != '' && steps.sonar.outcome == 'failure'
        # Wait long enough that the single retry lands *after* the transient
        # clears. SonarCloud/API blips and rate-limit windows are minute-scale, so
        # a 30s backoff re-hit the same outage and both attempts failed together.
        # Issue #27 raised it to 60s (rate 43.8% -> 16.7%); the residual 1/6 failure
        # (issue #80) was a transient that outlasted a single minute, so the retry
        # still re-hit it. The org standard mandates a *single* retry, so the
        # backoff is the only lever left: 120s gives two minutes of headroom while
        # staying inside the job's 25-minute backstop (10 + 2 + 10 = 22 min worst
        # case). Paid only on the failure path; the happy path never waits.
        run: sleep 120
      - name: SonarCloud Scan (retry)
        if: env.SONAR_TOKEN != '' && steps.sonar.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        # Bound the retry too, so a hang on the second attempt also fails fast.
        timeout-minutes: 10