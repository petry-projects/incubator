# SonarCloud project configuration for petry-projects/incubator.
sonar.projectKey=petry-projects_incubator
sonar.organization=petry-projects
sonar.sources=.
sonar.tests=pocs/demand-radar/tests
sonar.python.version=3.11,3.12,3.13
# Python test coverage — pytest-cov generates coverage.xml in pocs/demand-radar/coverage.xml
sonar.python.coverage.reportPaths=pocs/demand-radar/coverage.xml
# Coverage gate scope: DemandRadar is a proof-of-concept — its stages are
# network/CLI orchestration (iTunes/HN/Reddit scraping, subprocess chaining) that
# is not meaningfully unit-testable to the product's 80% new-code gate. The pure
# ranking/parsing helpers ARE unit-tested (pocs/demand-radar/tests, run in CI), but
# the POC as a whole is exempt from the product coverage threshold rather than the
# threshold being loosened for real code.
sonar.coverage.exclusions=pocs/demand-radar/**
# Security-rule triage for the POC: SonarCloud's AI-injection taint rules treat a
# developer's own argparse CLI arguments as untrusted input and flag every local
# open()/subprocess/random call. For a local, developer-run research tool these are
# false positives. Scope the noise-only rules to the POC tree only; production code
# (including the CI workflows themselves) stays fully analyzed.
sonar.issue.ignore.multicriteria=e1,e2,e3
# Filesystem path built from local CLI args (trusted developer input).
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=pocs/demand-radar/**/*.py
# subprocess run of sibling stage scripts (hardcoded module names, local run).
sonar.issue.ignore.multicriteria.e2.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.e2.resourceKey=pocs/demand-radar/**/*.py
# random.random() used only for retry/backoff jitter — not a security context.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e3.resourceKey=pocs/demand-radar/**/*.py
# Generated data + built artifacts are not source to analyze.
# NB: sonar.tests dir must be excluded from sources too, or SonarCloud errors
# "File ... can't be indexed twice" (main/test sets must be disjoint).
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**,pocs/demand-radar/output/**,pocs/demand-radar/dashboard.html,pocs/demand-radar/dashboard.tmpl.html,pocs/demand-radar/tests/**
