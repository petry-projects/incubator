# SonarCloud project configuration for petry-projects/incubator.
sonar.projectKey=petry-projects_incubator
sonar.organization=petry-projects
sonar.sources=.
sonar.tests=pocs/demand-radar/tests
sonar.python.version=3.11,3.12,3.13
# Generated data + built artifacts are not source to analyze.
# NB: sonar.tests dir must be excluded from sources too, or SonarCloud errors
# "File ... can't be indexed twice" (main/test sets must be disjoint).
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**,pocs/demand-radar/output/**,pocs/demand-radar/dashboard.html,pocs/demand-radar/dashboard.tmpl.html,pocs/demand-radar/tests/**
